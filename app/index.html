<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <!-- viewport-fit=cover: ノッチ・ホームバーの下まで描き、safe-area-inset でよける -->
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta name="color-scheme" content="dark" />
        <!-- 個人用。検索エンジンに載せない（GitHub Pages ではヘッダーを付けられないので、このメタだけで伝える） -->
        <meta name="robots" content="noindex, nofollow" />
        <!-- ホーム画面のアプリ（PWA）。色は暗い背景に合わせる -->
        <meta name="theme-color" content="#0e0d12" />
        <!-- manifest とアイコンは / から書く。本番ビルドでは vite が base（./）に合わせて ./ に書き換える -->
        <link rel="manifest" href="/manifest.webmanifest" />
        <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="mobile-web-app-capable" content="yes" />
        <!-- black-translucent: ステータスバーを透かし、暗い背景の上に白い文字で出す（viewport-fit=cover と組で使う） -->
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <meta name="apple-mobile-web-app-title" content="Retro Boy" />
        <title>Retro Boy Snap</title>
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                overflow: hidden;
                background: #0e0d12;
                color: #e0e0e0;
                color-scheme: dark;
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
