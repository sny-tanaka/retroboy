<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <!--
            開発時の確かめ用（npm run dev で /link-test.html）。本番ビルドには入らない。
            アプリを 2 つ横に並べ、通信ケーブル（?link=tab）でつなぐ。タブを 2 つ開いても同じことができるが、
            裏に回ったタブはブラウザがタイマーを間引くので、1 画面に並べたほうが速さを正しく測れる。
            この画面の URL の linkDelay（片道 ms）・linkJitter（揺れの最大 ms）・sound・mute は、そのまま 2 つのアプリに渡す。
        -->
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="dark" />
        <title>Retro Boy Snap 通信ケーブルの試験</title>
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                background: #0e0d12;
                color: #d6d0e8;
                font: 13px system-ui, sans-serif;
            }
            body {
                display: flex;
                flex-direction: column;
            }
            p {
                margin: 6px 10px;
            }
            .pair {
                flex: 1;
                display: flex;
                gap: 8px;
                padding: 0 8px 8px;
                min-height: 0;
            }
            iframe {
                flex: 1;
                border: 1px solid #3a3550;
                border-radius: 8px;
                min-width: 0;
            }
        </style>
    </head>
    <body>
        <p id="info"></p>
        <div class="pair">
            <iframe
                id="left"
                title="左の端末"
                allow="autoplay; camera; clipboard-write"
            ></iframe>
            <iframe
                id="right"
                title="右の端末"
                allow="autoplay; camera; clipboard-write"
            ></iframe>
        </div>
        <script>
            const params = new URLSearchParams(location.search);
            const app = new URLSearchParams({
                link: "tab",
                // 組ごとに別の room にする（この画面を 2 つ開いても混ざらない）
                room: crypto.randomUUID(),
            });
            for (const name of ["linkDelay", "linkJitter", "linkWindow", "sound", "mute"]) {
                if (params.get(name)) app.set(name, params.get(name));
            }
            // ?mode=webrtc: タブどうしの道ではつながず、それぞれのメニューの「通信ケーブルでつなぐ」から
            // WebRTC でつなぐ（QR の代わりにコードのコピー・貼り付けを使う）
            const webrtc = params.get("mode") === "webrtc";
            // 音の出し方（?sound=1・?mute=1）は、WebRTC のときも渡す
            const sound = new URLSearchParams();
            for (const name of ["sound", "mute"]) {
                if (params.get(name)) sound.set(name, params.get(name));
            }
            const url = webrtc ? `/${sound.size ? `?${sound}` : ""}` : `/?${app}`;
            document.getElementById("left").src = url;
            document.getElementById("right").src = url;
            document.getElementById("info").textContent = webrtc
                ? "通信ケーブルの試験（WebRTC）: 左のメニュー →「通信ケーブルでつなぐ」→「QR を出す」、右は「QR を読む」で、コードをコピー・貼り付けしてつなぐ。"
                : `通信ケーブルの試験: 片道の遅れ ${params.get("linkDelay") || 0} ms・揺れ ${params.get("linkJitter") || 0} ms` +
                  "（URL に ?linkDelay=10&linkJitter=5 のように付けて変える。?mode=webrtc で WebRTC）。それぞれ「タップして開始」を押す。";
        </script>
    </body>
</html>
