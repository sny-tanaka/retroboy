# 本家 Retro Boy のコアを WASM にするためだけのクレート。自前のコードは持たない。
# 本家の #[wasm_bindgen] の関数（本家 src/wasm/api.rs）が、そのままこの cdylib から export される。
# 本家は scripts/prepare-core.sh が core/upstream/ に core/upstream.rev のコミットで取ってきて、
# core/patches/ のパッチ（通信ケーブルなど）を当てたものを使う（README「本家のコードに手を入れる」）。
[package]
name = "retroboy-snap-core"
license = "Apache-2.0"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
retroboy = { path = "upstream" }
